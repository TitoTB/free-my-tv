# Local configuration. Never commit config.properties.
# ./build.sh is generic; ./build.sh --personal deliberately embeds this configuration into a PRIVATE APK.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=
# Optional Fanart.tv project API key: cinema background fallback only.
fanart_key=

# Optional local Jellyseerr integration. Keep the key private, only in config.properties.
jellyseerr_url=
jellyseerr_key=

# Optional recent library row (Jellyfin profile ID and private server API key).
jellyfin_url=
jellyfin_key=
jellyfin_user=

# Optional indoor sensors. Private long-lived token, never commit or share it.
home_assistant_url=
home_assistant_token=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# true leaves cartoons and anime (TMDB's Animation genre) out of the picks.
hide_animation=false

# auto (follows the TV), or a language in app/assets/i18n (en, pt, es, de, ru, fr, ja, zh-CN…); LG and Samsung: en, es, pt, de, ru
language=auto

# true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=true

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=true)
# (a currency Binance has no pairs in, like INR, shows the prices in dollars)
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# Streaming services to leave out of the picks even when their app is on the TV, comma separated (on Google TV):
# netflix, prime, disney, hulu, paramount, peacock, globoplay, max, appletv, hotstar, okko, crunchyroll, oneplay.
# For apps the TV ships that you don't subscribe to (Prime Video on a Sony, say).
hide_services=

# Optional: a free Watchmode key (watchmode.com) makes the picks open the title's own page in its app (Prime Video,
# JioHotstar...), not just the app. Without it, they open the app. Keep it private.
watchmode_key=

# Optional local MQTT QA credentials. These are NOT embedded into the app.
# Configure the connection in TV Settings > HAndroid TV after installation.
# Use the broker LAN address, not the internal Home Assistant add-on hostname.
mqtt_host=
mqtt_port=1883
mqtt_username=
mqtt_password=

# Optional shared Google Photos album for the experience board.
experience_photo_album=

# Home Assistant entities: leave empty to disable an unconfigured binding.
# Example: sensor.indoor_temperature
ha_temperature_entity=
# Example: sensor.indoor_humidity
ha_humidity_entity=
# Example: input_select.room_scene
ha_scene_entity=
# Example: climate.room_heating
ha_heating_entity=
# Example: cover.room_blinds
ha_cover_entity=
# Example: light.study_light
ha_study_light_entity=
# Example: fan.study_fan
ha_study_fan_entity=
# Example: climate.study_air_conditioner
ha_study_climate_entity=
# Example: switch.bedroom_light
ha_bedroom_entity=
# Example: binary_sensor.washer_running
ha_washer_active_entity=
# Example: sensor.washer_remaining
ha_washer_remaining_entity=
# Example: sensor.washer_progress
ha_washer_progress_entity=
# Example: binary_sensor.dishwasher_running
ha_dishwasher_active_entity=
# Example: sensor.dishwasher_remaining
ha_dishwasher_remaining_entity=
# Example: sensor.dishwasher_progress
ha_dishwasher_progress_entity=
# Example: sensor.printer_state
ha_printer_active_entity=
# Example: sensor.printer_finish_time
ha_printer_remaining_entity=
# Example: sensor.printer_progress
ha_printer_progress_entity=

# ElevenLabs voice ID only. Enter the API key on the TV in Jarvis settings.
elevenlabs_voice_id=XrExE9yKIg1WjnnlVkGX

# Optional comma-separated LAN hosts allowed to use HTTP in PRIVATE builds.
# No wildcard; HTTPS stays mandatory for every other destination.
local_http_hosts=
